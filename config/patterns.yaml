# Pattern definitions (scalability seam #3 in CLAUDE.md): "data, not logic".
#
# Each pattern is a bundle of keywords/phrases (per locale) used to score an
# incoming, already-redacted observation against a known behaviour pattern.
# The demo runs on `burglary_casing`. `explosives_storage` exists to prove
# the same pipeline generalises to a different pattern definition (the
# Bodija scale slide) without touching app/extraction.py or app/clustering.py.
#
# A report that does not clear `min_score` against any pattern is filed as
# `unclassified` -- it is stored (for audit completeness) but never
# contributes to a watch/escalate cluster. This is what keeps ambient noise
# (a noise complaint, a lost goat, a domestic argument) from polluting a
# real pattern's corroboration count.
#
# `high_signal` + `watch` / `escalate`: a pattern can carry its own
# corroboration bar instead of inheriting the community's
# config/thresholds.yaml default (app/clustering.py resolves per-pattern
# first, falling back to the community default when a pattern omits these).
# This is still config, not a special case in code -- design rule #3
# ("never escalate on one report") is unchanged: `weapon_sighting` below
# still needs 2 distinct senders to escalate, not 1. What changes is that a
# single report is enough to surface it as a priority `watch` item on the
# desk immediately, rather than waiting on the same 3-sender bar every
# other pattern uses -- a threat description shouldn't sit in a queue
# behind a parked-car sighting. See docs/ai-usage.md for the reasoning.

min_score: 1

patterns:
  - id: burglary_casing
    name: "Burglary casing"
    locale_keywords:
      en-NG:
        - "unloading sack"
        - "unloading sacks"
        - "unloading bag"
        - "unloading bags"
        - "strange vehicle"
        - "unfamiliar vehicle"
        - "parked outside"
        - "casing"
        - "counting houses"
        - "watching the house"
        - "watching our house"
        - "photographing the house"
        - "photographing houses"
        - "climbed the fence"
        - "climbing the fence"
        - "loitering"
        - "checking gates"
        - "checking locks"
        - "testing the gate"
        - "scouting"
        - "night unloading"
        - "unloading at night"
        - "men unloading"
        - "unloading sacks into"
      # Yoruba, typed without tone marks (matching ignores them). None of
      # these contain an identity word, since keywords are matched after
      # redaction. Needs a fluent speaker's review before deployment.
      yo:
        - "n gbe apo sinu ile"
        - "won n wo ile wa"
        - "moto to ye lasan"
        - "won n yi ile ka"
        - "won n wo ile"
        - "n wo awon ile"
        - "won n ka ile"
        - "n ka awon ile"
        - "ya aworan ile"
        - "n ya foto ile"
        - "gbiyanju geeti"
        - "n wo geeti"
        - "n fa geeti"
        - "gun ogiri"
        - "fo ogiri"
        - "n gbe apo"
        - "n ko apo"
        - "moto kan duro"
        - "moto kan paaki"
        - "n rin kiri ni oru"

  - id: explosives_storage
    name: "Illegal explosives / hazardous material storage"
    locale_keywords:
      en-NG:
        - "drums being offloaded"
        - "chemical drums"
        - "mining explosives"
        - "blasting caps"
        - "storing explosives"
        - "strong smell of chemicals"
        - "warehouse activity at night"
        - "unmarked containers"
      yo:
        - "dromu kemika"
        - "n ko dromu"
        - "oorun kemika"
        - "ado oloro"
        - "ohun ibugbamu"
        - "apoti ti ko ni ami"

  - id: weapon_sighting
    name: "Weapon or armed-robbery sighting"
    # A single report is enough to show up as a priority watch item; two
    # distinct senders within a day escalates, instead of the default
    # 5 senders / 3 days -- see the file-level comment above. Never 1
    # sender to escalate: that line is not moved for any pattern.
    high_signal: true
    watch:
      min_distinct_senders: 1
      min_span_days: 0
    escalate:
      min_distinct_senders: 2
      min_span_days: 1
    locale_keywords:
      en-NG:
        - "weapon"
        - "weapons"
        - "gun"
        - "guns"
        - "pistol"
        - "gunshot"
        - "gunshots"
        - "cutlass"
        - "machete"
        - "robbers"
        - "gang of robbers"
        - "waving a gun"
        - "brandishing a weapon"
        - "had a gun"
        - "carrying a gun"
        - "he had a weapon"
      # Yoruba. Filled in for the demo build; like every yo list here it
      # needs a fluent speaker's review before a real deployment, and a
      # weapon list matters more than most, since it has the lowest bar.
      yo:
        - "ibon"
        - "yin ibon"
        - "gbe ada"
        - "mu ada"
        - "adigunjale"
        - "awon ole"
